<title>Cotizador de Eventos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F4F0; --surface:#FFFFFF; --ink:#1C2430; --muted:#5C6878; --line:#DADDE2;
  --accent:#B4502B; --ok:#2F7A4F; --bad:#A33A3A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171E; --surface:#1A212B; --ink:#E8ECF1; --muted:#9AA5B3; --line:#2B3442;
    --accent:#E08A62; --ok:#6CC08F; --bad:#E57B7B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171E; --surface:#1A212B; --ink:#E8ECF1; --muted:#9AA5B3; --line:#2B3442;
  --accent:#E08A62; --ok:#6CC08F; --bad:#E57B7B; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 14px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1100px;margin:0 auto}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:20px 0 16px}
.eyebrow{margin:0;color:var(--accent);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
h1{margin:2px 0 4px;font-size:24px;font-weight:600;text-wrap:balance}
h2{font-size:15px;font-weight:600}
h3{font-size:14px;font-weight:600;margin:0}
.meta,.msg{color:var(--muted);margin:0}
.msg{font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0;min-width:0}
main{padding:20px 0 40px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 10px;white-space:nowrap}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--bad)}
button[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;min-height:70px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.sub{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px}
.sec{margin:22px 0 8px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi span{display:block;color:var(--muted);font-size:12px}
.kpi b{font:500 20px "IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:800px){.cols{grid-template-columns:1fr 1fr}}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.over i{background:var(--bad)}
.catbar{display:grid;grid-template-columns:200px 1fr 120px;gap:10px;align-items:center;margin:8px 0}
@media (max-width:520px){.catbar{grid-template-columns:1fr;gap:4px}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.row label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0;flex:1 1 150px}
.row label.inline{flex-direction:row;align-items:center;flex:0 0 auto}
.inl{display:flex;align-items:center;gap:6px}
.panel{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.tablewrap{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:500;border-bottom:1px solid var(--line);padding:8px 6px;white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.best{color:var(--ok);font-weight:600}
.chosen{border-color:var(--ok)}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);white-space:nowrap}
.comment{border-bottom:1px solid var(--line);padding:10px 0}
.comment:last-child{border-bottom:0}
ul.msg{padding-left:18px;margin:0}
@media print{
  .no-print{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .card,.sub{border:1px solid #bbb;box-shadow:none;break-inside:avoid}
  th{color:#000}
  header.top,#nav,#evNombre,#evMeta{display:none!important}
  main,.wrap{padding:0!important;margin:0!important;max-width:none!important}
  .card{break-inside:auto}
  .sub,tr,details.det>summary{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <p class="eyebrow">Cotizador de Eventos</p>
    <p class="meta" id="evMeta"></p>
    <div class="row no-print" style="margin-top:10px">
      <button data-act="descargarRespaldo">Descargar respaldo</button>
      <button class="danger" data-act="borrarTodo">Iniciar cotización desde cero</button>
      <button class="primary" data-act="elegirArchivo">Cargar datos</button>
      <input type="file" id="archivo" accept=".json,application/json" hidden>
    </div>
  </div>
</header>

<nav class="wrap tabs no-print" id="nav" aria-label="Secciones"></nav>
<main class="wrap" id="main"></main>
<datalist id="cats"></datalist>

<script>
const KEY='evento-rae-v2', KEY_OLD='evento-rae-v1';
/* Estructura de la cotización al cliente: capítulos 01 a 09. */
const COTIZ_CAPS=[
  {cat:'01 Local y acondicionamiento',subs:['1.1 Alquiler de local','1.2 Limpieza previa y posterior','1.3 Energía eléctrica y servicios','1.4 Toldos, carpas o estructuras']},
  {cat:'02 Infraestructura y mobiliario',subs:['2.1 Mesas y sillas','2.2 Mesas de registro y recepción','2.3 Escenario o estrado','2.4 Podio o atril','2.5 Salas VIP o ambientes adicionales']},
  {cat:'03 Equipamiento audiovisual',subs:['3.1 Sistema de sonido y parlantes','3.2 Micrófonos inalámbricos','3.3 Pantalla LED o proyector','3.4 Iluminación escénica','3.5 Operador técnico']},
  {cat:'04 Montaje y decoración',subs:['4.1 Diseño y ambientación','4.2 Backing corporativo con logotipo','4.3 Arreglos florales y decoración','4.4 Señalética y paneles informativos','4.5 Instalación y desmontaje']},
  {cat:'05 Alimentación y bebidas',subs:['5.1 Coffee break','5.2 Almuerzo o cena','5.3 Bebidas y agua','5.4 Personal de atención','5.5 Vajilla y menaje','5.6 Bocaditos','5.7 Almuerzo','5.8 Cena','5.9 Bebidas','5.10 Personal de atención','5.11 Menaje','5.12 Panadería','5.13 Dulces y Postres','5.14 Salados','5.15 Torta']},
  {cat:'06 Personal y protocolo',subs:['6.1 Anfitriones y recepción','6.2 Maestro de ceremonias','6.3 Coordinador general','6.4 Personal de seguridad','6.5 Personal de limpieza durante el evento','6.6 Mozo']},
  {cat:'07 Comunicación y materiales',subs:['7.1 Invitaciones digitales o impresas','7.2 Credenciales y fotochecks','7.3 Material corporativo y merchandising','7.4 Fotografía y video','7.5 Diseño gráfico y piezas digitales']},
  {cat:'08 Logística y transporte',subs:['8.1 Transporte de equipos y mobiliario','8.2 Flete de materiales','8.3 Estacionamiento','8.4 Hospedaje y movilidad de invitados']},
  {cat:'09 Seguridad y contingencias',subs:['9.1 Botiquín y atención de primeros auxilios','9.2 Extintores y señalización de seguridad','9.3 Plan de contingencia por clima','9.4 Fondo para imprevistos']},
  {cat:'10 Performance',subs:['10.1 Stand Up Comedy','10.2 Orquesta Digital','10.3 Orquesta Musical','10.4 Danzas Típicas','10.5 Animación Cumpleaños','10.6 DJ','10.7 Maestro de Ceremonia','10.8 Gincana Corporativa']}
];
const UNID={'1.1':'Por evento','1.2':'Servicio','1.3':'Servicio','1.4':'m² / unidad','2.1':'Unidad','2.2':'Unidad','2.3':'m²','2.4':'Unidad','2.5':'Unidad','3.1':'Servicio','3.2':'Unidad','3.3':'m² / unidad','3.4':'Servicio','3.5':'Jornada','4.1':'Servicio','4.2':'m²','4.3':'Servicio','4.4':'Unidad','4.5':'Servicio','5.1':'Persona','5.2':'Persona','5.3':'Persona','5.4':'Persona / jornada','5.5':'Persona','6.1':'Persona / jornada','6.2':'Servicio','6.3':'Jornada','6.4':'Persona / jornada','6.5':'Jornada','7.1':'Unidad','7.2':'Unidad','7.3':'Unidad','7.4':'Servicio','7.5':'Servicio','8.1':'Servicio','8.2':'Servicio','8.3':'Unidad / servicio','8.4':'Servicio','9.1':'Servicio','9.2':'Servicio','9.3':'Servicio','9.4':'% del presupuesto','5.6':'Persona','5.7':'Persona','5.8':'Persona','5.9':'Persona','5.10':'Persona / jornada','5.11':'Persona','5.12':'Persona','5.13':'Persona','5.14':'Persona','10.1':'Servicio','10.2':'Servicio','10.3':'Servicio','10.4':'Servicio','10.5':'Servicio','10.6':'Servicio','10.7':'Servicio','10.8':'Servicio'};
/* Categorías de versiones anteriores: ya no existen en la cotización. Los productos que las usaban quedan sin partida. */
const LEGADO=[
  {cat:'CATERING',subs:['Bocaditos','Platos de fondo','Platos de cena','Bebidas','Torta']},
  {cat:'DECORACIÓN E INFRAESTRUCTURA',subs:['Alquiler de equipo de sonido','Alquiler de equipo para grupo','Alquiler de luces','Tarima','Banner','Decoración general','Menaje']},
  {cat:'SHOW',subs:['Grupo musical','Grupo digital','Animación','Grupo de Danza','StandUp Comedy','MULTIMEDIA']},
  {cat:'GASTOS GENERALES',subs:['Local','Mozos','Organizador','Anfitrión','Personal de apoyo','Seguridad']}
];
const CATS=['Catering','Decoración','Música y sonido','Audio y video','Personal','Transporte','Invitaciones','Local'];
const TABS=[['proveedores','Proveedores'],['cliente','Cliente'],['cronograma','Cronograma'],['cotizacion','Cotización cliente'],['utilidades','Utilidades']];
const DEF={cliente:{nombre:'',empresa:'',ruc:'',contacto:'',telefono:'',correo:''},evento:{nombre:'',fecha:'',lugar:'',invitados:0,inicio:'09:00'},cotiz:{admin:0,contingencia:5,igv:false},proveedores:[],cron:[],extra:[],off:{},seq:1};
let S, tab='proveedores', msg='', armed=false, picks={}, editCron=null, fotoAbierta=null, fotoNueva={}, confirmarBorrar=null;
/* Foto de producto: se reduce para que quepa en el navegador (máx. 600 px, JPEG). */
function comprimir(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,600/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.75));};im.onerror=rej;im.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}

function merge(o){const d=structuredClone(DEF);return Object.assign(d,o,{cliente:Object.assign(d.cliente,(o&&o.cliente)||{}),evento:Object.assign(d.evento,(o&&o.evento)||{}),cotiz:Object.assign(d.cotiz,(o&&o.cotiz)||{})});}
/* Normaliza datos: código único por proveedor, utilidad por ítem y partidas manuales. */
function normalizar(o){
  const provs=(o.proveedores||[]).map((p,k)=>({...p,codigo:p.codigo||('PRV-'+String(k+1).padStart(3,'0')),items:(p.items||[]).map((i,idx)=>{const leg=LEGADO.some(c=>String(i.sub||'').startsWith(c.cat+'|'));const sub=leg?'':(i.sub||'');const cargas=sub?(Array.isArray(i.cargas)?i.cargas.filter(l=>l&&l.id).map(l=>({id:l.id,cant:(l.cant==null||l.cant==='')?null:Number(l.cant)})):Array.from({length:(i.copias!==undefined?Math.max(0,Number(i.copias)||0):(i.cargado===false?0:1))},()=>({id:uid(),cant:null}))):[];return {...i,utilidad:Number(i.utilidad)||0,sel:undefined,sub,cargas,copias:cargas.length,cargado:cargas.length>0,codigo:i.codigo||(p.codigo+'-'+String(idx+1).padStart(2,'0'))};})}));
  const s=merge({...o,proveedores:provs,cron:Array.isArray(o.cron)?o.cron:[],extra:Array.isArray(o.extra)?o.extra:[],off:o.off||{}});
  s.seq=Math.max(Number(o.seq)||1,provs.length+1);
  return s;
}
function load(){try{
  const r=localStorage.getItem(KEY)||localStorage.getItem(KEY_OLD);
  return normalizar(r?JSON.parse(r):{});
}catch(e){return normalizar({});}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){msg='No se pudo guardar en este navegador.';}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const money=n=>'S/ '+(Number(n)||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>(Number(n)||0).toLocaleString('es-PE',{maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
function fmtFecha(f){if(!f)return'';return new Date(f+'T00:00').toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
const toMin=h=>{const [a,b]=(h||'00:00').split(':').map(Number);return a*60+b;};
const fromMin=m=>{const x=((m%1440)+1440)%1440;return pad(Math.floor(x/60))+':'+pad(x%60);};

/* Ítems: cantidad × precio unitario. Por confirmar no suma hasta tener precio. */
const itemSub=i=>i.porConfirmar?0:(Number(i.cantidad)||0)*(Number(i.precio)||0);
const totalProv=p=>(p.items||[]).reduce((s,i)=>s+itemSub(i),0);
const codigoNuevo=()=>{const c='PRV-'+String(S.seq).padStart(3,'0');S.seq++;return c;};
const catDe=s=>s?String(s).split('|')[0]:'Sin categoría';

/* Partidas de la cotización: capítulos 01–09 + partidas manuales + categorías anteriores. */
function catalogo(){
  return [
    ...COTIZ_CAPS.map(c=>({cat:c.cat,subs:[...c.subs,...S.extra.filter(e=>e.cap===c.cat).map(e=>e.nombre)]}))
  ];
}
const unidDe=s=>{const code=String(s).split(' ')[0];return UNID[code]||(S.extra.find(e=>e.nombre===s)||{}).unid||'';};
function subOpts(sel){
  return '<option value="">Sin partida</option>'+catalogo().map(c=>`<optgroup label="${esc(c.cat)}">${c.subs.map(s=>{const v=c.cat+'|'+s;return `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(s)}</option>`;}).join('')}</optgroup>`).join('');
}
function provOpts(sel){return '<option value="">—</option>'+S.proveedores.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.codigo)} · ${esc(p.nombre)}</option>`).join('');}

/* Totales por partida. Utilidad: porcentaje por ítem, oculto para el cliente. */
function porPartida(){
  const m={};
  S.proveedores.forEach(p=>(p.items||[]).forEach(i=>{
    if(!i.cargado) return;
    const k=i.sub||'';
    const r=m[k]||(m[k]={costo:0,util:0,cliente:0,n:0,pend:0,items:[]});
    (i.cargas||[]).forEach(l=>{
      const v={...i,prov:p,cantidad:l.cant==null?i.cantidad:l.cant,_lid:l.id,_n:1};
      r.items.push(v);
      if(i.porConfirmar){r.pend++;return;}
      const c=itemSub(v), u=c*(Number(i.utilidad)||0)/100;
      r.costo+=c; r.util+=u; r.cliente+=c+u; r.n+=1;
    });
  }));
  return m;
}
/* Horario en cadena: cada evento empieza cuando termina el anterior. */
function sincronizarHoras(){let t=toMin(S.evento.inicio||'09:00');S.cron.forEach(a=>{if(a.horaFija) t=toMin(a.horaFija);a.hora=fromMin(t);t+=Number(a.duracion)||0;});}
function finHora(h,d){if(!h)return'—';return fromMin(toMin(h)+(Number(d)||0));}

/* ===== Pestaña 1: PROVEEDORES ===== */
/* Producto: código automático, precio compra, utilidad % (manual) y precio venta calculado.
   Solo los productos "cargados al presupuesto" entran a la cotización, con la partida que ya tienen asignada. */
let filtroModo='lista', filtroTexto='';
const precioVenta=i=>i.porConfirmar?0:(Number(i.precio)||0)*(1+(Number(i.utilidad)||0)/100);
const etiquetaPartida=s=>s?String(s).replace('|',' · '):'Sin partida';
function codigoItemNuevo(p){
  const n=Math.max(0,...(p.items||[]).map(i=>{const m=String(i.codigo||'').match(/-(\d+)$/);return m?Number(m[1]):0;}))+1;
  return p.codigo+'-'+String(n).padStart(2,'0');
}
function itemsDe(ids){const r=[];S.proveedores.forEach(p=>(p.items||[]).forEach(i=>{if(ids.includes(i.id)) r.push(i);}));return r;}
/* Carga los productos marcados a su partida ya asignada. Si alguno no tiene partida, no se carga ninguno. */
function cargarAlPresupuesto(ids){
  const its=itemsDe(ids);
  const sin=its.filter(i=>!i.sub);
  if(sin.length) return `Error: ${sin.length} producto(s) no tienen partida asignada (${sin.slice(0,5).map(i=>i.descripcion).join(', ')}${sin.length>5?'…':''}). Asígnales una partida y vuelve a cargar; no se cargó ninguno.`;
  its.forEach(i=>setCargas(i,[...(i.cargas||[]),{id:uid(),cant:null}]));
  const partidas=new Set(its.map(i=>i.sub)).size;
  return `${its.length} producto(s) cargados exitosamente en ${partidas} partida(s).`;
}
function setCargas(i,arr){i.cargas=arr; i.copias=arr.length; i.cargado=arr.length>0;}
function quitarDelPresupuesto(ids){let n=0; itemsDe(ids).forEach(i=>{setCargas(i,[]);n++;}); return `${n} producto(s) quitados del presupuesto.`;}

let provAbierto=null;
function tarjetaProv(p){
  const its=p.items||[];
  return `<button data-act="abrirProv" data-id="${p.id}" style="text-align:left;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer">
    <span class="badge">${esc(p.codigo)}</span>
    <div style="font-weight:700;font-size:16px;margin-top:6px">${esc(p.nombre)}</div>
    <div class="msg">${its.length} producto(s) · ${money(totalProv(p))}</div>
  </button>`;
}
function vProv(){
  const abierto=provAbierto&&S.proveedores.find(x=>x.id===provAbierto);
  if(abierto){
    return `<div class="row no-print" style="justify-content:space-between;align-items:center">
      <button data-act="volverProv">← Volver a proveedores</button>
      <h2 style="margin:0">${esc(abierto.nombre)}</h2>
    </div>
    ${provCard(abierto)}`;
  }
  provAbierto=null;
  const grupos={}; S.proveedores.forEach(x=>{const k=x.categoria||'Sin categoría';(grupos[k]=grupos[k]||[]).push(x);});
  const bloques=Object.entries(grupos).map(([cat,ps])=>`<div class="card" style="margin-top:12px">
    <h2 style="margin:0 0 10px">${esc(cat)}</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px">${ps.map(tarjetaProv).join('')}</div>
  </div>`).join('');
  return `<form class="card row" data-form="proveedor">
      <label>Código<input value="Se genera automáticamente" disabled></label>
      <label>Categoría<input name="categoria" list="cats" required placeholder="Ej. Catering"></label>
      <label>Proveedor<input name="nombre" required></label>
      <label>Contacto<input name="contacto" placeholder="Teléfono o correo"></label>
      <button class="primary" type="submit">Crear proveedor</button>
    </form>
    <div class="card no-print" style="margin-top:12px">
      <p class="msg" style="margin-top:0">La data de proveedores incluye productos, precios, utilidades, partidas y fotos.</p>
      <div class="row" style="margin-top:8px">
        <button class="primary" data-act="exportProv">EXPORTAR DATA PROVEEDORES</button>
        <button class="primary" data-act="elegirProv">CARGAR DATA PROVEEDORES</button>
        <button data-act="imprimir">Ver / guardar PDF</button>
        <input type="file" id="archivoProv" accept=".json,application/json" hidden>
      </div>
    </div>
    ${vComparador()}
    ${bloques||'<p class="empty sec">Sin proveedores. Crea uno y luego agrega sus productos con cantidad y precio de compra.</p>'}`;
}

/* Comparador: desplegable con los productos, o búsqueda manual por nombre. */
function nombresProductos(){return [...new Set(S.proveedores.flatMap(p=>(p.items||[]).map(i=>String(i.descripcion||'').trim())).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));}
function vComparador(){
  const nombres=nombresProductos();
  return `<div class="card no-print" style="margin-top:12px">
    <h2 style="margin-top:0">Comparar precios entre proveedores</h2>
    <div class="row">
      <label style="flex-basis:320px">Producto

      ${filtroModo==='manual'?`<label style="flex-basis:320px">Buscar por nombre<input id="filtroManual" value="${esc(filtroTexto)}" placeholder="Escribe parte del nombre" autocomplete="off"></label>`:''}
    </div>
    <div id="resultados" style="margin-top:8px">${resultados()}</div>
  </div>`;
}
function resultados(){
  const q=filtroTexto.trim().toLowerCase();
  if(!q) return '<p class="msg">Elige un producto o escribe parte del nombre para ver el precio de cada proveedor.</p>';
  const filas=[];
  S.proveedores.forEach(p=>(p.items||[]).forEach(i=>{
    const d=String(i.descripcion||'').trim().toLowerCase();
    const ok=filtroModo==='manual'?d.includes(q):d===q;
    if(ok) filas.push({p,i,venta:precioVenta(i)});
  }));
  if(!filas.length) return '<p class="empty">No hay productos con ese nombre.</p>';
  const validos=filas.filter(f=>!f.i.porConfirmar).map(f=>f.venta);
  const min=validos.length?Math.min(...validos):null;
  return `<div class="tablewrap"><table>
    <thead><tr><th>Seleccionar</th><th>Código</th><th>Proveedor</th><th>Producto</th><th>Unidad</th><th class="num">Cant.</th><th class="num">Precio compra</th><th class="num">Utilidad</th><th class="num">Precio venta</th><th>Partida</th><th>En presupuesto</th></tr></thead>
    <tbody>${filas.map(({p,i,venta})=>{const mejor=!i.porConfirmar&&venta===min;return `<tr>
      <td><input type="checkbox" data-pick="${i.id}" ${picks[i.id]?'checked':''} aria-label="Seleccionar ${esc(i.descripcion)} de ${esc(p.nombre)}"></td>
      <td><span class="badge">${esc(i.codigo)}</span></td><td>${esc(p.nombre)}</td><td>${esc(i.descripcion)}</td><td>${esc(i.unidad)||'—'}</td>
      <td class="num">${num(i.cantidad)}</td><td class="num">${i.porConfirmar?'Por confirmar':money(i.precio)}</td>
      <td class="num">${num(i.utilidad)} %</td>
      <td class="num ${mejor?'best':''}">${i.porConfirmar?'Por confirmar':money(venta)}${mejor?' <span class="msg">más bajo</span>':''}</td>
      <td>${esc(etiquetaPartida(i.sub))}</td>
      <td>${i.cargado?`<span class="badge">Sí${(i.copias||1)>1?` × ${i.copias}`:''}</span>`:'No'}</td></tr>`;}).join('')}</tbody></table></div>
    <div class="row" style="margin-top:10px"><button class="primary" data-act="cargarSel">CARGAR A PRESUPUESTO</button></div>`;
}

/* ===== Pestaña 4: COTIZACIÓN AL CLIENTE ===== */
/* Partidas: se pueden encender o apagar; las apagadas no suman. La utilidad no se muestra: el precio ya la incluye. */
function vCotizacion(){
  const P=porPartida(), z=S.cotiz;
  const pk=(cat,s)=>cat+'|'+s;
  const aplica=k=>!S.off[k];
  const fila=(k,titulo,unid)=>{
    const r=P[k]||{cliente:0,items:[],pend:0,n:0}, on=aplica(k);
    const lines=r.items;
    return `<details class="det ${(lines.length&&on)?'':'vacia-print'}" style="border-top:1px solid var(--line);${on?'':'opacity:.55'}">
      <summary style="display:flex;justify-content:space-between;gap:12px;cursor:pointer;padding:10px 0;list-style:none;align-items:center">
        <span><label class="inline no-print" style="margin-right:8px" onclick="event.stopPropagation()"><input type="checkbox" data-off="${esc(k)}" ${on?'checked':''} aria-label="Aplica"> Aplica</label>
          ${esc(titulo)}${unid?` <span class="msg">· ${esc(unid)}</span>`:''} <span class="msg">· ${lines.length} ${lines.length===1?'ítem':'ítems'}${r.pend?` · ${r.pend} por confirmar`:''}</span></span>
        <span class="num"><b>${on?money(r.cliente):'No aplica'}</b></span>
      </summary>
      ${S.extra.some(e=>e.cap===k.split('|')[0]&&e.nombre===k.split('|')[1])?`<div class="no-print" style="margin-bottom:8px"><button class="danger" data-act="delExtra" data-k="${esc(k)}">Eliminar esta partida manual</button></div>`:''}
      ${lines.length?`<div class="tablewrap" style="margin-bottom:8px"><table class="detalle-cot" style="font-size:12px">
        <thead><tr><th>Producto / servicio</th><th>Unidad de metrado</th><th class="num">Cantidad</th><th class="num">P. unitario</th><th class="num">Subtotal</th><th class="no-print"></th></tr></thead>
        <tbody>${lines.map(l=>{const pu=(Number(l.precio)||0)*(1+(Number(l.utilidad)||0)/100);return `<tr><td>${esc(l.descripcion)}</td><td>${esc(l.unidad)}</td><td class="num"><input class="no-print" type="number" min="0" step="any" value="${Number(l.cantidad)||0}" data-cant="${l._lid}" data-i="${l.id}" style="width:80px;font-size:12px" aria-label="Cantidad de ${esc(l.descripcion)}"><span class="print-only">${num(l.cantidad)}</span></td><td class="num">${l.porConfirmar?'<b>Por confirmar</b>':money(pu)}</td><td class="num">${l.porConfirmar?'Por confirmar':money(itemSub(l)*(1+(Number(l.utilidad)||0)/100))}</td><td class="no-print"><button class="danger" data-act="quitarCot" data-i="${l.id}" data-c="${l._lid}" aria-label="Quitar esta carga de ${esc(l.descripcion)}">Quitar</button></td></tr>`;}).join('')}</tbody>
      </table></div>`:'<p class="msg" style="padding-bottom:8px">Sin ítems asignados todavía.</p>'}
    </details>`;
  };
  const caps=catalogo().map(c=>{
    const subs=c.subs.filter(s=>/^\d\d /.test(c.cat)||P[pk(c.cat,s)]||S.extra.some(e=>e.nombre===s&&e.cap===c.cat));
    if(!subs.length) return '';
    const tot=subs.reduce((t,s)=>{const k=pk(c.cat,s);return t+(aplica(k)&&P[k]?P[k].cliente:0);},0);
    const hayItems=subs.some(s=>{const k=pk(c.cat,s);return aplica(k)&&P[k]&&P[k].items.length;});
    return `<div class="card ${hayItems?'':'vacia-print'}" style="margin-top:12px">
      <div class="row" style="justify-content:space-between;align-items:baseline"><h2 style="margin:0">${esc(c.cat)}</h2><b class="num">${money(tot)}</b></div>
      ${subs.map(s=>fila(pk(c.cat,s),s,unidDe(s))).join('')}
    </div>`;
  }).join('');
  const subtotal=Object.keys(P).filter(k=>k&&aplica(k)).reduce((t,k)=>t+P[k].cliente,0);
  const admin=subtotal*(Number(z.admin)||0)/100;
  const cont=(subtotal+admin)*(Number(z.contingencia)||0)/100;
  const antes=subtotal+admin+cont, igv=z.igv?antes*0.18:0, total=antes+igv;
  const sinClas=(P[''])?P[''].n+P[''].pend:0;
  const fotos=[];
  catalogo().forEach(c=>c.subs.forEach(s=>{const k=pk(c.cat,s); if(!aplica(k)||!P[k]) return; P[k].items.filter(i=>i.foto).forEach(i=>fotos.push({foto:i.foto,desc:i.descripcion,partida:s}));}));
  const panelFotos=fotos.length?`<div class="card" style="margin-top:12px"><h2 style="margin-top:0">Fotografías de productos</h2><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px">${fotos.map(f=>`<figure style="margin:0"><img src="${f.foto}" alt="${esc(f.desc)}" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line)"><figcaption style="font-size:13px;margin-top:4px"><b>${esc(f.desc)}</b><br><span class="msg">${esc(f.partida)}</span></figcaption></figure>`).join('')}</div></div>`:'';
  const capOpts=COTIZ_CAPS.map(c=>`<option value="${esc(c.cat)}">${esc(c.cat)}</option>`).join('');
  return `<style>.print-only{display:none}.salto-print{height:0}@media print{.salto-print{break-before:page;page-break-before:always}.vacia-print{display:none!important}.print-only{display:inline}.no-print-in{display:none!important}.detalle-cot td,.detalle-cot th{padding:4px 6px;vertical-align:middle}.detalle-cot thead{display:table-header-group}.resumen-print,.det,.card,tr,table{break-inside:avoid;page-break-inside:avoid}}</style>
  <div class="row no-print" style="justify-content:space-between;align-items:center">
    <h2 style="margin:0">Cotización para el cliente</h2>
    <button data-act="imprimir">Imprimir / guardar PDF</button>
  </div>
  <div class="card" style="margin-top:12px">
    <h1 style="font-size:20px;margin:0">${esc(S.evento.nombre)||'Evento'}</h1>
    <p class="msg">${esc(fmtFecha(S.evento.fecha))||'Fecha por definir'} · ${Number(S.evento.invitados)||0} invitados · ${esc(S.evento.lugar)||'Lugar por definir'}</p>
    <p class="msg" style="margin-top:6px"><b>Cliente:</b> ${esc(S.cliente.nombre)||'Por definir'}${S.cliente.empresa?' · '+esc(S.cliente.empresa):''}${S.cliente.ruc?' · RUC/DNI '+esc(S.cliente.ruc):''}${S.cliente.contacto?' · Contacto: '+esc(S.cliente.contacto):''}</p>

function vUtilidades(){

    <td>${esc(k.replace('|',' · '))}${S.off[k]?' <span class="badge">No aplica</span>':''}</td>

  const tc=Object.keys(P).reduce((t,k)=>t+P[k].costo,0), tu=Object.keys(P).reduce((t,k)=>t+P[k].util,0);
  const provs=S.proveedores.map(p=>{const its=(p.items||[]).filter(i=>!i.porConfirmar);
    const c=its.reduce((t,i)=>t+itemSub(i),0), u=its.reduce((t,i)=>t+itemSub(i)*(Number(i.utilidad)||0)/100,0);
    return `<tr><td>${esc(p.codigo)} · ${esc(p.nombre)}</td><td class="num">${money(c)}</td><td class="num">${money(u)}</td></tr>`;}).join('');
  return `<div class="card">

      <tbody>${filas}<tr><td><b>Total</b></td><td class="num"><b>${money(tc)}</b></td><td class="num"><b>${money(tu)}</b></td><td class="num"><b>${money(tc+tu)}</b></td></tr></tbody>
    </table></div>`:'<p class="empty">Aún no hay ítems asignados a partidas.</p>'}
  </div>
  <div class="card" style="margin-top:12px">
    <h2 style="margin-top:0">Utilidad por proveedor</h2>
    ${provs?`<div class="tablewrap"><table><thead><tr><th>Proveedor</th><th class="num">Costo directo</th><th class="num">Utilidad</th></tr></thead><tbody>${provs}</tbody></table></div>`:'<p class="empty">Sin proveedores.</p>'}

/* Aviso que se borra solo a los 2 segundos. */
function toast(texto,tipo){
  const d=document.createElement('div');
  d.setAttribute('role','status');
  d.textContent=texto;
  const fondo=tipo==='error'?'var(--bad)':'var(--ink)', color=tipo==='error'?'#fff':'var(--bg)';
  d.style.cssText=`position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:50;background:${fondo};color:${color};font-weight:600;padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:90vw;text-align:center`;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),2000);
}
function descargar(nombre,obj){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

    else{confirmarBorrar=null; borrarPestana('cliente'); borrarPestana('cronograma'); borrarPestana('cotizacion'); S.proveedores.forEach(p=>(p.items||[]).forEach(i=>{i.sub='';i.utilidad=0;setCargas(i,[]);})); fotoAbierta=null; tab='cliente'; msg='Cotización reiniciada desde cero. Los proveedores se conservan.';}
  }
  else if(a==='cargarSel'){const ids=Object.keys(picks).filter(k=>picks[k]); if(!ids.length){msg='Marca al menos un producto.';} else {const r=cargarAlPresupuesto(ids); if(r.startsWith('Error')){toast('ERROR PARTIDAS NO ASIGNADAS','error');} else {toast(r); msg=''; picks={};}}}
  else if(a==='quitarSel'){const ids=Object.keys(picks).filter(k=>picks[k]); if(!ids.length){msg='Marca al menos un producto.';} else {msg=quitarDelPresupuesto(ids); picks={};}}

  }
  else return;

});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='filtroSel'){
    if(t.value==='__manual__'){filtroModo='manual';filtroTexto='';}
    else {filtroModo='lista';filtroTexto=t.value;}
    render(); return;
  }
  if(t.dataset.cant!==undefined){const it=itemsDe([t.dataset.i])[0], l=it&&(it.cargas||[]).find(x=>x.id===t.dataset.cant); if(l){l.cant=t.value===''?null:(Number(t.value)||0);} save(); render(); return;}
  if(t.dataset.cargado!==undefined){
    const p=buscarProv(t.dataset.id), i=p&&(p.items||[]).find(x=>x.id===t.dataset.cargado);
    if(i){ if(t.checked&&!i.sub){t.checked=false; msg='Asigna una partida antes de cargar este producto.';} else {setCargas(i,t.checked?[...(i.cargas||[]),{id:uid(),cant:null}]:[]);} }
    save(); render(); return;
  }
  else if(t.dataset.fotonueva!==undefined){cargarFotoNueva(t.dataset.fotonueva,t.files&&t.files[0]); t.value=''; return;}
  if(t.dataset.foto!==undefined){
    const f=t.files&&t.files[0]; if(!f) return;
    comprimir(f).then(url=>{const p=buscarProv(t.dataset.id), i=p&&(p.items||[]).find(x=>x.id===t.dataset.foto); if(i){i.foto=url; fotoAbierta=null; msg='Foto guardada. Pulsa el ojo para verla.';} save(); render();}).catch(()=>{msg='No se pudo leer la imagen.'; render();});
    t.value=''; return;
  }
  if(t.dataset.pick!==undefined){picks[t.dataset.pick]=t.checked;return;}
  if(t.dataset.pc!==undefined){const p=buscarProv(t.dataset.id), i=p&&(p.items||[]).find(x=>x.id===t.dataset.pc); if(i) i.porConfirmar=t.checked;}
  else if(t.dataset.off!==undefined){S.off[t.dataset.off]=!t.checked;}
  else if(t.dataset.edit){
    const f=t.dataset.field; let v=NUMS.includes(f)?Number(t.value)||0:t.value;
    if(t.dataset.edit==='prov'){const p=buscarProv(t.dataset.id); if(p) p[f]=v;}
    else if(t.dataset.edit==='item'){const p=buscarProv(t.dataset.id), i=p&&(p.items||[]).find(x=>x.id===t.dataset.i); if(i){i[f]=v; if(f==='sub'&&!v) setCargas(i,[]);}}
    else if(t.dataset.edit==='cron'){const a=S.cron.find(x=>x.id===t.dataset.id); if(a) a[f]=v;}
  }
  else if(t.id==='archivo'){
    const f=t.files&&t.files[0]; if(!f) return;
    f.text().then(txt=>{
      try{const o=JSON.parse(txt); if(!o||!o.evento) throw new Error('x'); S=normalizar(o); msg='Datos restaurados desde el archivo.';}
      catch(err){msg='El archivo no es un respaldo válido.';}
      save(); render();
    });
    t.value=''; return;
  }
  else if(t.id==='archivoProv'){
    const f=t.files&&t.files[0]; if(!f) return;
    f.text().then(txt=>{
      try{
        const o=JSON.parse(txt); if(!o||!Array.isArray(o.proveedores)) throw new Error('x');
        o.proveedores.forEach(np=>{
          const ex=S.proveedores.find(p=>p.codigo===np.codigo);
          if(ex){Object.assign(ex,{nombre:np.nombre,contacto:np.contacto,categoria:np.categoria,items:np.items||[]});}
          else{S.proveedores.push({...np,id:uid(),codigo:np.codigo||codigoNuevo(),items:(np.items||[]).map(i=>({utilidad:0,...i}))});}
        });
        S=normalizar(S);
        const its=o.proveedores.reduce((n,p)=>n+(p.items||[]).length,0), fotos=o.proveedores.reduce((n,p)=>n+(p.items||[]).filter(i=>i.foto).length,0);
        msg=`Data cargada: ${o.proveedores.length} proveedor(es), ${its} producto(s), ${fotos} foto(s).`;
      }catch(err){msg='El archivo no contiene proveedores válidos.';}
      save(); render();
    });
    t.value=''; return;
  }
  else return;
  save(); render();
});

  const e=S.evento, c=S.cliente;
  const filas=S.cron.map(a=>`<tr><td class="num">${esc(a.hora||'—')} – ${esc(finHora(a.hora,a.duracion))}</td><td><b>${esc(a.evento)}</b></td><td class="num">${Number(a.duracion)||0} min</td><td>${esc(a.comentario||'')}</td><td>${esc(a.indicaciones||'')}</td></tr>`).join('');
  document.getElementById('cron-print').innerHTML=`<h1>Cronograma del evento</h1>
    <p><b>${esc(e.nombre)||'Evento'}</b> · ${esc(fmtFecha(e.fecha))||'Fecha por definir'} · ${Number(e.invitados)||0} invitados · ${esc(e.lugar)||'Lugar por definir'}</p>
    <p>Cliente: ${esc(c.nombre)||'Por definir'}${c.empresa?' · '+esc(c.empresa):''}</p>
    <table><thead><tr><th>Horario</th><th>Evento</th><th>Duración</th><th>Comentarios</th><th>Indicaciones</th></tr></thead>
    <tbody>${filas||'<tr><td colspan="5">Sin eventos</td></tr>'}</tbody></table>`;
  document.body.classList.add('imprimir-cron');
  window.addEventListener('afterprint',()=>document.body.classList.remove('imprimir-cron'),{once:true});
  window.print();
}
S=load();
render();
</script>
</body>
</html>
