<title>Control del Aniversario RAE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F4F0; --surface:#FFFFFF; --ink:#1C2430; --muted:#5C6878; --line:#DADDE2;
  --accent:#B4502B; --ok:#2F7A4F; --bad:#A33A3A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171E; --surface:#1A212B; --ink:#E8ECF1; --muted:#9AA5B3; --line:#2B3442;
    --accent:#E08A62; --ok:#6CC08F; --bad:#E57B7B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171E; --surface:#1A212B; --ink:#E8ECF1; --muted:#9AA5B3; --line:#2B3442;
  --accent:#E08A62; --ok:#6CC08F; --bad:#E57B7B; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 14px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1100px;margin:0 auto}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:20px 0 16px}
.eyebrow{margin:0;color:var(--accent);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
h1{margin:2px 0 4px;font-size:24px;font-weight:600;text-wrap:balance}
h2{font-size:15px;font-weight:600}
h3{font-size:14px;font-weight:600;margin:0}
.meta,.msg{color:var(--muted);margin:0}
.msg{font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0;min-width:0}
main{padding:20px 0 40px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 10px;white-space:nowrap}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--bad)}
button[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;min-height:70px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.sub{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px}
.sec{margin:22px 0 8px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi span{display:block;color:var(--muted);font-size:12px}
.kpi b{font:500 20px "IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:800px){.cols{grid-template-columns:1fr 1fr}}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.over i{background:var(--bad)}
.catbar{display:grid;grid-template-columns:200px 1fr 120px;gap:10px;align-items:center;margin:8px 0}
@media (max-width:520px){.catbar{grid-template-columns:1fr;gap:4px}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.row label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0;flex:1 1 150px}
.row label.inline{flex-direction:row;align-items:center;flex:0 0 auto}
.inl{display:flex;align-items:center;gap:6px}
.panel{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.tablewrap{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:500;border-bottom:1px solid var(--line);padding:8px 6px;white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.best{color:var(--ok);font-weight:600}
.chosen{border-color:var(--ok)}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);white-space:nowrap}
.comment{border-bottom:1px solid var(--line);padding:10px 0}
.comment:last-child{border-bottom:0}
ul.msg{padding-left:18px;margin:0}
@media print{
  .no-print{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .card,.sub{border:1px solid #bbb;box-shadow:none;break-inside:avoid}
  th{color:#000}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <p class="eyebrow">Control de evento</p>
    <h1 id="evNombre"></h1>
    <p class="meta" id="evMeta"></p>
    <div class="row no-print" style="margin-top:10px">
      <button data-act="descargarRespaldo">Descargar respaldo</button>
      <button class="primary" data-act="elegirArchivo">Cargar datos</button>
      <input type="file" id="archivo" accept=".json,application/json" hidden>
    </div>
  </div>
</header>

<nav class="wrap tabs no-print" id="nav" aria-label="Secciones"></nav>
<main class="wrap" id="main"></main>
<datalist id="cats"></datalist>

<script>
const DEF={evento:{nombre:'Aniversario RAE',fecha:'',lugar:'',invitados:0,presupuesto:0,inicio:'09:00'},cronograma:[],gastos:[],proveedores:[],comentarios:[],partidas:[{id:'local-generales',nombre:'Local y costos generales'}],catalogo:[
  {cat:'CATERING',subs:['Bocaditos','Platos de fondo','Platos de cena','Bebidas','Torta']},
  {cat:'DECORACIÓN E INFRAESTRUCTURA',subs:['Alquiler de equipo de sonido','Alquiler de equipo para grupo','Alquiler de luces','Tarima','Banner','Decoración general','Menaje']},
  {cat:'SHOW',subs:['Grupo musical','Grupo digital','Animación','Grupo de Danza','StandUp Comedy','MULTIMEDIA']},
  {cat:'GASTOS GENERALES',subs:['Local','Mozos','Organizador','Anfitrión','Personal de apoyo','Seguridad']}
]};
const KEY='evento-rae-v1';
const TABS=[['resumen','Resumen'],['cronograma','Cronograma'],['gastos','Gastos'],['proveedores','Proveedores'],['presupuesto','Presupuesto final'],['cotizacion','Cotización cliente'],['comentarios','Comentarios'],['ajustes','Ajustes']];
const CATS=['Local','Catering','Música y sonido','Decoración','Audio y video','Personal','Transporte','Invitaciones','Premios y obsequios','Imprevistos'];
const ESTADOS=['Pendiente','En curso','Listo'];
let tab='resumen', armed=false, msg='', abierto=null, cargaProv=null, editando=null, picks={};

function merge(o){const d=structuredClone(DEF);return Object.assign(d,o,{evento:Object.assign(d.evento,(o&&o.evento)||{})});}
function load(){try{
  const r=localStorage.getItem(KEY); const o=r?JSON.parse(r):{};
  if(!(o.evento&&o.evento.inicio)&&Array.isArray(o.cronograma)&&o.cronograma.length){
    const ord=[...o.cronograma].sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
    o.evento=Object.assign({},o.evento,{inicio:ord[0].hora||'09:00'}); o.cronograma=ord;
  }
  const s=merge(o);
  /* El catálogo de categorías viene siempre del código, para que las novedades aparezcan aunque haya datos guardados. */
  s.catalogo=structuredClone(DEF.catalogo);
  return s;
}catch(e){const s=merge({});s.catalogo=structuredClone(DEF.catalogo);return s;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){msg='No se pudo guardar en este navegador.';}}
let S=load();

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const money=n=>'S/ '+(Number(n)||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>(Number(n)||0).toLocaleString('es-PE',{maximumFractionDigits:2});
const eff=x=>Number(x.real)>0?Number(x.real):(Number(x.estimado)||0);
const sum=a=>a.reduce((s,x)=>s+eff(x),0);
const pad=n=>String(n).padStart(2,'0');
function finHora(h,d){if(!h)return'—';const [a,b]=h.split(':').map(Number);const t=a*60+b+(Number(d)||0);return pad(Math.floor(t/60)%24)+':'+pad(t%60);}
function fmtFecha(f){if(!f)return'';return new Date(f+'T00:00').toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function dias(){if(!S.evento.fecha)return null;const hoy=new Date();hoy.setHours(0,0,0,0);return Math.ceil((new Date(S.evento.fecha+'T00:00')-hoy)/86400000);}

/* Ítems: cantidad × precio unitario. Un proveedor tiene un catálogo de ítems; cada cotización cargada en una actividad conserva los ítems marcados. */
/* Un ítem "por confirmar" no suma al total hasta que se le ponga precio. */
const itemSub=i=>i.porConfirmar?0:(Number(i.cantidad)||0)*(Number(i.precio)||0);
/* Cantidad de ítems de una actividad que están por confirmar precio (no suman). */
const pendCount=a=>(a.cotizaciones||[]).reduce((n,q)=>n+(q.items||[]).filter(i=>i.porConfirmar).length,0);
const totalProv=p=>(p.items||[]).reduce((s,i)=>s+itemSub(i),0);
const montoQ=q=>(q.items||[]).filter(i=>i.sel).reduce((s,i)=>s+itemSub(i),0);

/* Centros de costo */
const actOf=id=>S.cronograma.find(x=>x.id===id);
const gastosDe=id=>S.gastos.filter(g=>g.actividadId===id);
const generales=()=>S.gastos.filter(g=>!actOf(g.actividadId)&&!S.partidas.some(p=>p.id===g.actividadId));
/* Todo lo cargado desde Proveedores (ítems marcados) suma al costo del centro. */
const servicio=a=>(a.cotizaciones||[]).reduce((s,q)=>s+montoQ(q),0);
const costoAct=a=>sum(gastosDe(a.id))+servicio(a);
const totalComp=()=>sum(S.gastos)+S.cronograma.reduce((s,a)=>s+servicio(a),0);
const toMin=h=>{const [a,b]=(h||'00:00').split(':').map(Number);return a*60+b;};
const fromMin=m=>{const x=((m%1440)+1440)%1440;return pad(Math.floor(x/60))+':'+pad(x%60);};
/* Horario en cadena: cada actividad empieza cuando termina la anterior. */
function sincronizarHoras(){let t=toMin(S.evento.inicio||'09:00');S.cronograma.forEach(a=>{a.hora=fromMin(t);t+=Number(a.duracion)||0;});}
const ordenCron=()=>S.cronograma;
/* Subcategoría guardada como "CATEGORÍA|Subcategoría". */
const catDe=s=>s?String(s).split('|')[0]:'Sin categoría';
function subOpts(sel){
  return '<option value="">Sin clasificar</option>'+S.catalogo.map(c=>`<optgroup label="${esc(c.cat)}">${c.subs.map(s=>{const v=c.cat+'|'+s;return `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(s)}</option>`;}).join('')}</optgroup>`).join('');
}
function actividadesOpts(sel){
  const parts=S.partidas.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.nombre)}</option>`).join('');
  const acts=ordenCron().map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.hora||'')} ${esc(a.actividad)}</option>`).join('');
  return '<option value="">General (sin partida)</option>'+(parts?`<optgroup label="Partidas generales">${parts}</optgroup>`:'')+`<optgroup label="Actividades">${acts}</optgroup>`;
}
function provOpts(excluir=[]){return S.proveedores.filter(p=>!excluir.includes(p.id)).map(p=>`<option value="${p.id}">${esc(p.nombre)} · ${esc(p.categoria)} · ${money(totalProv(p))}</option>`).join('');}

/* Carga un proveedor como cotización de una actividad. selIds: ítems marcados (null = todos). */
function cargarQuote(p,actId,selIds){
  const act=actOf(actId); if(!act) return {ok:false,msg:'Actividad no encontrada.'};
  if(!(p.items||[]).length) return {ok:false,msg:`${p.nombre} no tiene ítems. Agrégalos en Proveedores.`};
  act.cotizaciones=act.cotizaciones||[];
  const pick=p.items.filter(i=>!selIds||selIds.includes(i.id)).map(i=>({...i,sel:true}));
  const q=act.cotizaciones.find(x=>x.id===p.id);
  if(q){
    const nuevos=pick.filter(i=>!(q.items||[]).some(x=>x.id===i.id));
    if(!nuevos.length) return {ok:false,msg:`Esos ítems ya están en "${act.actividad}".`};
    q.items=[...(q.items||[]),...nuevos]; act.tercerizado=true;
    return {ok:true,msg:`${nuevos.length} ítem(s) de ${p.nombre} agregados a "${act.actividad}".`};
  }
  act.tercerizado=true;
  act.cotizaciones.push({id:p.id,proveedor:p.nombre,contacto:p.contacto||'',calificacion:p.calificacion||3,items:pick});
  return {ok:true,msg:`${p.nombre} agregado a "${act.actividad}".`};
}

function vResumen(){
  const comp=totalComp(), pag=sum(S.gastos.filter(x=>x.pagado));
  const pres=Number(S.evento.presupuesto)||0, disp=pres-comp, pct=pres?Math.min(100,comp/pres*100):0, over=pres>0&&comp>pres;
  const inv=Number(S.evento.invitados)||0, d=dias();
  const pendCron=S.cronograma.filter(x=>x.estado!=='Listo').length, pendPago=S.gastos.filter(x=>!x.pagado).length;
  const tercSin=S.cronograma.filter(a=>a.tercerizado&&servicio(a)===0).length;
  const cats={}; S.gastos.forEach(g=>{const k=g.categoria||'Sin categoría';cats[k]=(cats[k]||0)+eff(g);});
  const max=Math.max(0,...Object.values(cats));
  const catRows=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="catbar"><span>${esc(k)}</span><div class="bar"><i style="width:${max?v/max*100:0}%"></i></div><span class="num">${money(v)}</span></div>`).join('');
  return `
  <div class="grid4">
    <div class="card kpi"><span>Presupuesto</span><b>${money(pres)}</b></div>
    <div class="card kpi"><span>Comprometido (${pct.toFixed(0)}%)</span><b>${money(comp)}</b></div>
    <div class="card kpi"><span>Pagado (gastos)</span><b>${money(pag)}</b></div>
    <div class="card kpi"><span>Disponible</span><b style="color:${disp<0?'var(--bad)':'inherit'}">${money(disp)}</b></div>
    <div class="card kpi"><span>Días para el evento</span><b>${d===null?'—':d}</b></div>
    <div class="card kpi"><span>Costo por invitado</span><b>${inv?money(comp/inv):'—'}</b></div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="bar ${over?'over':''}"><i style="width:${pct}%"></i></div>
    <p class="msg" style="margin-top:8px">${over?'El compromiso supera el presupuesto.':pres?'Uso del presupuesto.':'Define el presupuesto en Ajustes para ver el avance.'}</p>
  </div>
  <div class="cols" style="margin-top:16px">
    <div class="card"><h2 style="margin-top:0">Pendientes</h2>
      <ul class="msg">
        <li>${pendCron} actividades sin completar</li>
        <li>${pendPago} gastos sin pagar</li>
        <li>${tercSin} actividades tercerizadas sin servicios cargados</li>
      </ul>
    </div>
    <div class="card"><h2 style="margin-top:0">Gasto por categoría</h2>${catRows||'<p class="empty">Aún no hay gastos. Regístralos en la pestaña Gastos.</p>'}</div>
  </div>
  <div class="card" style="margin-top:16px"><h2 style="margin-top:0">Centros de costo (por actividad)</h2>${vCentros()}</div>`;
}

function vCentros(){
  if(!S.cronograma.length&&!S.gastos.length) return '<p class="empty">Crea actividades en Cronograma; cada una tendrá su centro de costo.</p>';
  const items=ordenCron().map(a=>[`${a.hora||'—'} · ${a.actividad}${a.tercerizado?' (tercerizado)':''}`,costoAct(a)]);
  S.partidas.forEach(p=>items.push([p.nombre+' (partida)',sum(S.gastos.filter(g=>g.actividadId===p.id))]));
  items.push(['General (sin actividad)',sum(generales())]);
  const max=Math.max(0,...items.map(i=>i[1]));
  return items.map(([k,v])=>`<div class="catbar"><span>${esc(k)}</span><div class="bar"><i style="width:${max?v/max*100:0}%"></i></div><span class="num">${money(v)}</span></div>`).join('');
}

function vCron(){
  const lista=ordenCron().map(a=>cardAct(a)).join('');
  return `<form class="card row" data-form="cronograma">
    <label style="flex-basis:160px">Hora de inicio (opcional)<input type="time" name="horaInicio"></label>
    <label style="flex-basis:220px">Insertar después de<select name="despuesDe"><option value="">Al final del programa</option><option value="__inicio__">Al inicio del programa (antes de la primera)</option>${S.cronograma.map(a=>`<option value="${a.id}">${esc(a.hora||'')} ${esc(a.actividad)}</option>`).join('')}</select></label>
    <label>Duración (min)<input type="number" name="duracion" min="5" step="5" value="30"></label>
    <label style="flex-basis:220px">Actividad<input name="actividad" required placeholder="Ej. Bienvenida y brindis"></label>
    <label>Responsable<input name="responsable" placeholder="Nombre"></label>
    <label>Estado<select name="estado">${ESTADOS.map(e=>`<option>${e}</option>`).join('')}</select></label>
    <label class="inline"><input type="checkbox" name="tercerizado"> Tercerizado</label>
    <label style="flex-basis:300px">Cargar proveedor del directorio (opcional)<select name="proveedorId"><option value="">Ninguno</option>${provOpts()}</select></label>
    <label style="flex-basis:100%">Notas<input name="notas" placeholder="Opcional"></label>
    <button class="primary" type="submit">Agregar al programa</button>
  </form>
  <h2 class="sec">Programa del evento</h2>
  ${lista||'<p class="empty">Sin actividades. Agrega la primera con el formulario de arriba; el programa se ordena solo por hora.</p>'}`;
}

function editCard(a){
  const i=S.cronograma.indexOf(a);
  return `<div class="card" style="margin-top:12px">
    <h3>Editar actividad</h3>
    <form class="row" data-form="editar" style="margin-top:10px">
      <input type="hidden" name="id" value="${a.id}">
      <label>Hora de inicio<input type="time" name="hora" value="${esc(a.hora)}"></label>
      <label>Duración (min)<input type="number" name="duracion" min="5" step="5" value="${Number(a.duracion)||0}" required></label>
      <label style="flex-basis:220px">Actividad<input name="actividad" required value="${esc(a.actividad)}"></label>
      <label>Responsable<input name="responsable" value="${esc(a.responsable)}"></label>
      <label>Estado<select name="estado">${ESTADOS.map(e=>`<option ${e===a.estado?'selected':''}>${e}</option>`).join('')}</select></label>
      <label class="inline"><input type="checkbox" name="tercerizado" ${a.tercerizado?'checked':''}> Tercerizado</label>
      <label style="flex-basis:100%">Notas<input name="notas" value="${esc(a.notas)}"></label>
      <p class="msg" style="flex-basis:100%">${i===0?'Cambiar la hora de la primera actividad cambia la hora de inicio del programa.':'Cambiar la hora de inicio ajusta la duración de la actividad anterior, para que no queden huecos ni cruces.'}</p>
      <button class="primary" type="submit">Guardar cambios</button>
      <button type="button" data-act="cancelar">Cancelar</button>
    </form>
  </div>`;
}

function cardAct(a){
  const open=abierto===a.id;
  if(editando===a.id) return editCard(a);
  const idx=S.cronograma.indexOf(a), n=S.cronograma.length;
  return `<div class="card" style="margin-top:12px">
    <div class="row" style="align-items:center;justify-content:space-between">
      <div>
        <span class="num"><b>${esc(a.hora)||'—'} – ${finHora(a.hora,a.duracion)}</b></span> · <input value="${esc(a.actividad)}" data-upd="cronograma" data-id="${a.id}" data-field="actividad" aria-label="Nombre de la actividad" style="font-weight:700;min-width:240px;max-width:100%"> ${a.tercerizado?'<span class="badge">Tercerizado</span>':''}
        <div class="msg"><span class="inl">Duración <input type="number" min="5" step="5" value="${Number(a.duracion)||0}" data-upd="cronograma" data-id="${a.id}" data-field="duracion" aria-label="Duración en minutos" style="width:84px"> min</span> · ${esc(a.responsable)||'Sin responsable'}${a.notas?' · '+esc(a.notas):''}${pendCount(a)?` · <b style="color:#b45309">${pendCount(a)} por confirmar (no suman)</b>`:''}</div>
      </div>
      <div class="row" style="align-items:center">
        <span class="num"><b>${money(costoAct(a))}</b></span>
        <select data-upd="cronograma" data-id="${a.id}" data-field="estado" aria-label="Estado">${ESTADOS.map(e=>`<option ${e===a.estado?'selected':''}>${e}</option>`).join('')}</select>
        <button data-act="mover" data-id="${a.id}" data-dir="-1" ${idx===0?'disabled':''} aria-label="Subir">↑</button>
        <button data-act="mover" data-id="${a.id}" data-dir="1" ${idx===n-1?'disabled':''} aria-label="Bajar">↓</button>
        <button data-act="editar" data-id="${a.id}">Editar</button>

function centro(a){
  const gs=gastosDe(a.id);
  const dir=sum(gs), pag=sum(gs.filter(g=>g.pagado)), srv=servicio(a);
  const filas=gs.map(g=>{
    const dif=Number(g.real)>0?(Number(g.estimado)||0)-Number(g.real):null;
    return `<tr>
      <td>${esc(g.concepto)}</td>
      <td>${esc(g.categoria)||'—'}</td>
      <td>${esc(g.proveedor)||'—'}</td>
      <td class="num">${money(g.estimado)}</td>
      <td class="num"><input type="number" step="0.01" min="0" value="${Number(g.real)||''}" data-upd="gastos" data-id="${g.id}" data-field="real" aria-label="Monto real" style="width:110px;text-align:right"></td>
      <td><label><input type="checkbox" data-act="pagado" data-id="${g.id}" ${g.pagado?'checked':''}> ${g.pagado?'Pagado':'Pendiente'}</label></td>
      <td><button class="danger" data-act="del" data-list="gastos" data-id="${g.id}">Quitar</button></td>
    </tr>`;}).join('');
  return `<div class="panel">
    <div class="grid4">
      <div class="card kpi"><span>Gastos directos</span><b>${money(dir)}</b></div>
      <div class="card kpi"><span>Servicio contratado</span><b>${money(srv)}</b></div>
      <div class="card kpi"><span>Total del centro</span><b>${money(dir+srv)}</b></div>
      <div class="card kpi"><span>Pagado</span><b>${money(pag)}</b></div>
    </div>

    <h3 class="sec">Gastos de esta actividad</h3>
    <form class="row" data-form="gasto-acto">
      <input type="hidden" name="actividadId" value="${a.id}">
      <label style="flex-basis:200px">Concepto<input name="concepto" required placeholder="Ej. Alquiler de mesas"></label>
      <label>Subcategoría (cotización)<select name="sub">${subOpts('')}</select></label>
      <label>Proveedor<input name="proveedor" placeholder="Opcional"></label>
      <label>Estimado (S/)<input type="number" name="estimado" min="0" step="0.01" required></label>
      <label>Real (S/)<input type="number" name="real" min="0" step="0.01" placeholder="Si ya se sabe"></label>
      <button class="primary" type="submit">Agregar gasto</button>
    </form>
    ${gs.length?`<div class="tablewrap"><table>
      <thead><tr><th>Concepto</th><th>Categoría</th><th>Proveedor</th><th class="num">Estimado</th><th class="num">Real</th><th>Pago</th><th></th></tr></thead>
      <tbody>${filas}</tbody></table></div>`
    :'<p class="msg" style="margin-top:8px">Sin gastos directos en este centro.</p>'}

    ${a.tercerizado?comparativa(a):'<p class="msg" style="margin-top:14px">Esta actividad no es tercerizada. Carga un proveedor desde Cronograma o Proveedores para compararlos.</p>'}
  </div>`;
}

function comparativa(a){
  const qs=a.cotizaciones||[], n=qs.length;
  const minM=n?Math.min(...qs.map(montoQ)):null;
  const agregar=`<div class="row" style="margin-top:10px">
      <label style="flex-basis:300px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px">Agregar proveedor del directorio
        <select id="addq-${a.id}"><option value="">Elegir proveedor…</option>${provOpts(qs.map(q=>q.id))}</select></label>
      <button class="primary" data-act="addq" data-id="${a.id}">Agregar (${n+1} de 3)</button>
    </div>`;
  const bloques=qs.map(q=>{
    const m=montoQ(q), low=false;
    return `<div class="sub">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div><b>${esc(q.proveedor)}</b> ${q.contacto?`<span class="msg">· ${esc(q.contacto)}</span>`:''}</div>
        <div class="row" style="align-items:center">
          <span class="num ${low?'best':''}"><b>${money(m)}</b></span>${low?'<span class="msg">más bajo</span>':''}

        </div>
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th>Incluir</th><th>Descripción</th><th>Unidad</th><th>Subcategoría</th><th class="num">Cantidad</th><th class="num">P. unitario</th><th class="num">Subtotal</th></tr></thead>
        <tbody>${(q.items||[]).slice().sort((x,y)=>(y.porConfirmar?1:0)-(x.porConfirmar?1:0)).map(i=>`<tr${i.porConfirmar?' style="background:#fef3c7"':''}>
          <td><input type="checkbox" data-act="itemsel" data-id="${a.id}" data-q="${q.id}" data-i="${i.id}" ${i.sel?'checked':''} aria-label="Incluir ${esc(i.descripcion)}"></td>
          <td><input value="${esc(i.descripcion)}" data-qdesc="${a.id}" data-q="${q.id}" data-i="${i.id}" aria-label="Descripción del ítem" style="width:100%;min-width:180px"></td><td>${esc(i.unidad)||'—'}</td>
          <td><select data-qsub="${a.id}" data-q="${q.id}" data-i="${i.id}" aria-label="Subcategoría de ${esc(i.descripcion)}">${subOpts(i.sub||'')}</select></td>
          <td class="num">${num(i.cantidad)}</td><td class="num">${money(i.precio)}</td>
          <td class="num">${i.porConfirmar?'<b style="color:#b45309">Por confirmar</b>':(i.sel?money(itemSub(i)):'—')}</td>
        </tr>`).join('')}</tbody></table></div>
    </div>`;}).join('');
  const txt=srvTxt(a);
  return `<div style="margin-top:16px"><h3>Proveedores cargados</h3>

/* Presupuesto final: una línea por cada gasto directo y cada ítem tercerizado elegido. */
function lineasPresupuesto(){

/* Presupuesto detallado: cada gasto directo y cada ítem tercerizado elegido, con su centro de costo, categoría y proveedor. */
function lineasDetalle(){
  const L=[], nom=a=>`${a.hora||''} ${a.actividad}`.trim();
  const add=(a,o)=>L.push(Object.assign({actId:a?a.id:'general',actividad:a?nom(a):'General (sin actividad)'},o));
  const gasto=(a,g)=>add(a,{tipo:'Gasto directo',concepto:g.concepto,categoria:g.categoria||'',sub:g.sub||'',proveedor:g.proveedor||'',cantidad:1,unidad:'',unitario:eff(g),estimado:Number(g.estimado)||0,real:Number(g.real)||0,subtotal:eff(g),pagado:!!g.pagado});
  ordenCron().forEach(a=>{
    gastosDe(a.id).forEach(g=>gasto(a,g));
    if(a.tercerizado) (a.cotizaciones||[]).forEach(q=>{
      const prov=S.proveedores.find(p=>p.id===q.id);
      (q.items||[]).filter(i=>i.sel).forEach(i=>add(a,{tipo:'Servicio tercerizado',concepto:i.descripcion,categoria:i.sub?catDe(i.sub):(prov?prov.categoria:''),sub:i.sub||'',proveedor:q.proveedor,cantidad:Number(i.cantidad)||0,unidad:i.unidad||'',unitario:Number(i.precio)||0,estimado:itemSub(i),real:0,subtotal:itemSub(i),pagado:null,porConfirmar:!!i.porConfirmar}));
    });
  });
  generales().forEach(g=>gasto(null,g));
  S.partidas.forEach(p=>S.gastos.filter(g=>g.actividadId===p.id).forEach(g=>gasto({id:p.id,hora:'',actividad:p.nombre+' (partida)'},g)));
  return L;
}
function agrupar(L,key){const m={}; L.forEach(l=>{const k=l[key]||'Sin definir'; m[k]=(m[k]||0)+l.subtotal;}); return Object.entries(m).sort((a,b)=>b[1]-a[1]);}

  <div class="card" style="margin-top:12px">
    <h2 style="margin-top:0">Respaldo</h2>
    <p class="msg">Los datos viven en este navegador. Copia el respaldo y guárdalo para no perder información, o pega uno para restaurarlo.</p>
    <textarea id="exp" readonly style="min-height:120px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;margin-top:8px">${esc(JSON.stringify(S,null,2))}</textarea>
    <div class="row" style="margin-top:8px"><button data-act="copiar">Copiar respaldo</button><button class="primary" data-act="descargarRespaldo">Descargar respaldo (.json)</button></div>
    <label style="display:block;margin-top:14px;font-size:12px;color:var(--muted)">Restaurar desde un respaldo
      <textarea id="imp" placeholder="Pega aquí el respaldo"></textarea></label>    <div class="row" style="margin-top:8px"><button data-act="importar">Reemplazar datos con este respaldo</button><button class="danger" data-act="reset">${armed?'Pulsa de nuevo para borrar todo':'Borrar todo'}</button></div>
  </div>`;
}

function render(){
  sincronizarHoras();
  const sugerencias=[...new Set([...CATS,...S.cronograma.map(a=>a.actividad),...S.gastos.map(g=>g.categoria),...S.proveedores.map(p=>p.categoria)].filter(Boolean).map(x=>String(x).trim()).filter(Boolean))];
  $('#cats').innerHTML=sugerencias.map(c=>`<option value="${esc(c)}">`).join('');
  $('#nav').innerHTML=TABS.map(([id,l])=>`<button data-act="tab" data-id="${id}" aria-current="${id===tab?'page':'false'}">${l}${id==='comentarios'&&S.comentarios.length?` (${S.comentarios.length})`:''}</button>`).join('');
  $('#evNombre').textContent=S.evento.nombre||'Evento sin nombre';
  const meta=[fmtFecha(S.evento.fecha),S.evento.lugar,S.evento.invitados?`${S.evento.invitados} invitados`:''].filter(Boolean).join(' · ');
  $('#evMeta').textContent=meta||'Completa los datos del evento en Ajustes';
  const V={resumen:vResumen,cronograma:vCron,gastos:vGastos,proveedores:vProv,presupuesto:vPresupuestoDetallado,cotizacion:vCotizacion,comentarios:vCom,ajustes:vAjustes}[tab];
  $('#main').innerHTML=V()+(msg?`<p class="msg" role="status" style="margin-top:12px">${esc(msg)}</p>`:'');
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, id=b.dataset.id;
  if(a==='tab'){tab=id;msg='';armed=false;}
  else if(a==='editar'){editando=id;abierto=null;}
  else if(a==='cancelar'){editando=null;}
  else if(a==='mover'){
    const i=S.cronograma.findIndex(x=>x.id===id), j=i+Number(b.dataset.dir);
    if(i>=0&&j>=0&&j<S.cronograma.length){[S.cronograma[i],S.cronograma[j]]=[S.cronograma[j],S.cronograma[i]];}
  }
  else if(a==='abrir'){abierto=abierto===id?null:id;}
  else if(a==='del'){
    S[b.dataset.list]=S[b.dataset.list].filter(x=>x.id!==id);
    if(b.dataset.list==='cronograma'&&abierto===id) abierto=null;
  }
  else if(a==='pagado'){const g=S.gastos.find(x=>x.id===id); if(g) g.pagado=b.checked;}
  else if(a==='abrirCarga'){cargaProv=cargaProv===id?null:id;}
  else if(a==='cargar'){
    const p=S.proveedores.find(x=>x.id===id); if(!p) return;
    const grupos={};
    document.querySelectorAll(`select[data-itemsel="${id}"]`).forEach(s=>{if(s.value){(grupos[s.value]=grupos[s.value]||[]).push(s.dataset.i);}});
    const claves=Object.keys(grupos);
    if(!claves.length){msg='Asigna al menos un ítem a una actividad.';}
    else{
      const res=claves.map(ac=>cargarQuote(p,ac,grupos[ac]));
      msg=res.map(r=>r.msg).join(' ');
      if(res.some(r=>r.ok)) cargaProv=null;
    }
  }
  else if(a==='addq'){
    const act=actOf(id), sel=document.getElementById('addq-'+id);
    if(!act) return;
    if(!sel||!sel.value){msg='Elige un proveedor del directorio.';}
    else{const p=S.proveedores.find(x=>x.id===sel.value); const r=p?cargarQuote(p,id,null):{msg:'Proveedor no encontrado.'}; msg=r.msg;}
  }
  else if(a==='cargarSel'){
    const p=S.proveedores.find(x=>x.id===id); if(!p) return;
    const sel=document.getElementById('bulkact-'+id);
    const ids=(p.items||[]).filter(i=>picks[i.id]).map(i=>i.id);
    if(!sel||!sel.value){msg='Elige una actividad.';}
    else if(!ids.length){msg='Marca al menos un ítem de la tabla.';}
    else{const r=cargarQuote(p,sel.value,ids); msg=r.msg; if(r.ok){ids.forEach(k=>delete picks[k]); cargaProv=null;}}
  }
  else if(a==='todosItems'){
    const p=S.proveedores.find(x=>x.id===id); if(!p) return;
    const on=!(p.items||[]).every(i=>picks[i.id]);
    (p.items||[]).forEach(i=>{picks[i.id]=on;});
  }
  else if(a==='cargaritem'){
    const p=S.proveedores.find(x=>x.id===id), it=p&&(p.items||[]).find(x=>x.id===b.dataset.i);
    const sel=document.getElementById('isel-'+b.dataset.i);
    if(!p||!it) return;
    if(!sel||!sel.value){msg='Elige una actividad para este ítem.';}
    else{const r=cargarQuote(p,sel.value,[it.id]); msg=r.msg;}
  }
  else if(a==='delitem'){
    const p=S.proveedores.find(x=>x.id===id); if(p) p.items=(p.items||[]).filter(x=>x.id!==b.dataset.i);
  }
  else if(a==='itemsel'){
    const act=actOf(id), q=act&&(act.cotizaciones||[]).find(x=>x.id===b.dataset.q);
    const it=q&&(q.items||[]).find(x=>x.id===b.dataset.i); if(!it) return;
    it.sel=b.checked;
  }
  else if(a==='delq'){
    const act=actOf(id); if(!act) return;
    act.cotizaciones=(act.cotizaciones||[]).filter(x=>x.id!==b.dataset.q);
  }
  else if(a==='csv'){
    try{descargarCSVDetallado(); msg='Presupuesto detallado descargado en tu computadora.';}
    catch(err){msg='No se pudo descargar aquí. Usa Imprimir / guardar PDF.';}
  }
  else if(a==='imprimir'){
    try{window.print();}catch(err){msg='La impresión no está disponible aquí.';}
    return;
  }
  else if(a==='elegirArchivo'){
    document.getElementById('archivo').click(); return;
  }
  else if(a==='descargarRespaldo'){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob), link=document.createElement('a');
    link.href=url; link.download='respaldo-aniversario-rae-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    msg='Respaldo descargado. Guárdalo en un lugar seguro.'; render(); return;
  }
  else if(a==='copiar'){
    navigator.clipboard.writeText($('#exp').value).then(()=>{msg='Respaldo copiado.';render();},()=>{$('#exp').select();msg='Selecciona el texto y cópialo manualmente.';render();});
    return;
  }
  else if(a==='importar'){
    try{const o=JSON.parse($('#imp').value); if(!o||!o.evento) throw new Error('sin evento'); S=merge(o); S.catalogo=structuredClone(DEF.catalogo); msg='Datos restaurados.';}
    catch(err){msg='El texto no es un respaldo válido.';}
  }
  else if(a==='reset'){
    if(!armed){armed=true;msg='Pulsa de nuevo para borrar todo.';}
    else{S=structuredClone(DEF);armed=false;abierto=null;cargaProv=null;msg='Datos borrados.';}
  }
  else return;
  save(); render();
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pick){picks[t.dataset.i]=t.checked;return;}
  if(t.id==='archivo'){
    const f=t.files&&t.files[0]; if(!f) return;
    f.text().then(txt=>{
      try{const o=JSON.parse(txt); if(!o||!o.evento) throw new Error('sin evento'); S=merge(o); S.catalogo=structuredClone(DEF.catalogo); msg='Datos restaurados desde el archivo.';}
      catch(err){msg='El archivo no es un respaldo válido.';}
      save(); render();
    });
    return;
  }
  if(t.dataset.pc){
    const p=S.proveedores.find(x=>x.id===t.dataset.pc), it=p&&(p.items||[]).find(x=>x.id===t.dataset.i);
    if(!it) return;
    it.porConfirmar=t.checked;
    S.cronograma.forEach(a=>(a.cotizaciones||[]).forEach(q=>{if(q.id===p.id)(q.items||[]).forEach(qi=>{if(qi.id===it.id) qi.porConfirmar=t.checked;});}));
    save(); render(); return;
  }
  if(t.dataset.bulk){document.querySelectorAll(`select[data-itemsel="${t.dataset.bulk}"]`).forEach(s=>s.value=t.value);return;}
  if(t.dataset.item){
    const p=S.proveedores.find(x=>x.id===t.dataset.item), it=p&&(p.items||[]).find(x=>x.id===t.dataset.i);
    if(!it) return;
    const f=t.dataset.field, v=f==='descripcion'?(String(t.value).trim()||it.descripcion):Math.max(0,Number(t.value)||0);
    it[f]=v;
    /* Las cotizaciones ya cargadas en actividades se actualizan con el mismo precio o cantidad. */
    S.cronograma.forEach(a=>(a.cotizaciones||[]).forEach(q=>{if(q.id===p.id)(q.items||[]).forEach(qi=>{if(qi.id===it.id) qi[f]=v;});}));
  }
  /* Subcategoría de un ítem del catálogo: también se aplica a las cotizaciones ya cargadas. */
  else if(t.dataset.itemsub){
    const p=S.proveedores.find(x=>x.id===t.dataset.itemsub), it=p&&(p.items||[]).find(x=>x.id===t.dataset.i);
    if(!it) return;
    it.sub=t.value;
    S.cronograma.forEach(a=>(a.cotizaciones||[]).forEach(q=>{if(q.id===p.id)(q.items||[]).forEach(qi=>{if(qi.id===it.id) qi.sub=t.value;});}));
  }
  /* Subcategoría de un ítem ya cargado en una actividad (solo esa cotización). */
  else if(t.dataset.qdesc){
    const a=actOf(t.dataset.qdesc), q=a&&(a.cotizaciones||[]).find(x=>x.id===t.dataset.q), qi=q&&(q.items||[]).find(x=>x.id===t.dataset.i);
    if(!qi) return;
    qi.descripcion=String(t.value).trim()||qi.descripcion;
  }
  else if(t.dataset.qsub){
    const a=actOf(t.dataset.qsub), q=a&&(a.cotizaciones||[]).find(x=>x.id===t.dataset.q), qi=q&&(q.items||[]).find(x=>x.id===t.dataset.i);
    if(!qi) return;
    qi.sub=t.value;
  }
  else if(t.dataset.upd){
    const it=S[t.dataset.upd].find(x=>x.id===t.dataset.id);
    if(!it) return;
    let v=t.type==='number'?(Number(t.value)||0):t.value;
    if(t.dataset.field==='duracion'&&v<5){v=5;msg='La duración mínima es 5 minutos.';}
    if(t.dataset.field==='actividad'){v=String(t.value).trim()||it.actividad;}
    it[t.dataset.field]=v;
  }
  else if(t.dataset.evento){
    S.evento[t.dataset.evento]=t.type==='number'?(Number(t.value)||0):t.value;
  }
  else return;
  save(); render();
});

document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target, k=f.dataset.form; if(!k) return;
  const d=Object.fromEntries(new FormData(f).entries());
  const id=uid(); let aviso='';
  if(k==='cronograma'){
    const pos=d.despuesDe==='__inicio__'?0:d.despuesDe?S.cronograma.findIndex(x=>x.id===d.despuesDe)+1:S.cronograma.length;
    const prev=pos>0?S.cronograma[pos-1]:null;
    if(d.horaInicio&&prev&&toMin(d.horaInicio)-toMin(prev.hora)<5){
      aviso='La actividad anterior quedaría con menos de 5 minutos. Elige una hora más tarde.';
    }else{
      const nueva={id,hora:'',duracion:Number(d.duracion)||0,actividad:d.actividad.trim(),responsable:(d.responsable||'').trim(),estado:d.estado,notas:(d.notas||'').trim(),tercerizado:d.tercerizado==='on',cotizaciones:[]};
      if(d.horaInicio){ if(prev) prev.duracion=toMin(d.horaInicio)-toMin(prev.hora); else S.evento.inicio=d.horaInicio; }
      S.cronograma.splice(pos,0,nueva);
      const pSel=d.proveedorId?S.proveedores.find(x=>x.id===d.proveedorId):null;
      if(pSel){const r=cargarQuote(pSel,id,null); aviso=r.msg; abierto=id;}
      else abierto=nueva.tercerizado?id:abierto;
    }
  }
  else if(k==='editar'){
    const a=actOf(d.id); if(!a) return;
    const idx=S.cronograma.indexOf(a), prev=idx>0?S.cronograma[idx-1]:null;
    if(prev&&d.hora&&toMin(d.hora)-toMin(prev.hora)<5){
      aviso='La actividad anterior quedaría con menos de 5 minutos. Elige una hora más tarde.';
    }else{
      if(d.hora&&d.hora!==a.hora){ if(idx===0) S.evento.inicio=d.hora; else prev.duracion=toMin(d.hora)-toMin(prev.hora); }
      Object.assign(a,{duracion:Number(d.duracion)||0,actividad:d.actividad.trim(),responsable:(d.responsable||'').trim(),estado:d.estado,notas:(d.notas||'').trim(),tercerizado:d.tercerizado==='on'});
      editando=null; aviso='Actividad actualizada.';
    }
  }
  else if(k==='gasto-acto'){
    S.gastos.push({id,concepto:d.concepto.trim(),categoria:catDe(d.sub),sub:d.sub||'',proveedor:(d.proveedor||'').trim(),estimado:Number(d.estimado)||0,real:d.real?Number(d.real)||0:0,actividadId:d.actividadId,pagado:false});
  }
  else if(k==='gastos'){
    S.gastos.push({id,concepto:d.concepto.trim(),categoria:catDe(d.sub),sub:d.sub||'',proveedor:(d.proveedor||'').trim(),estimado:Number(d.estimado)||0,real:d.real?Number(d.real)||0:0,actividadId:d.actividadId||'',pagado:false});
  }
  else if(k==='proveedores'){
    S.proveedores.push({id,categoria:(d.categoria||'Sin categoría').trim(),nombre:d.nombre.trim(),contacto:(d.contacto||'').trim(),calificacion:Number(d.calificacion)||3,ventajas:(d.ventajas||'').trim(),desventajas:(d.desventajas||'').trim(),items:[]});
  }
  else if(k==='item'){
    const p=S.proveedores.find(x=>x.id===d.provId); if(!p) return;
    p.items=[...(p.items||[]),{id,descripcion:d.descripcion.trim(),unidad:(d.unidad||'').trim(),cantidad:Number(d.cantidad)||0,precio:Number(d.precio)||0,sub:d.sub||''}];
  }
  else if(k==='partida'){ S.partidas.push({id,nombre:d.nombre.trim()}); }
  else if(k==='comentarios') S.comentarios.push({id,autor:d.autor.trim(),seccion:d.seccion,texto:d.texto.trim(),fecha:new Date().toISOString()});
  else return;
  msg=aviso; armed=false;
  f.reset(); save(); render();
});

$('#cats').innerHTML=CATS.map(c=>`<option value="${esc(c)}">`).join('');
render();
</script>
